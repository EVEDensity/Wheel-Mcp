name: godot-smoke

on:
  push:
  pull_request:

jobs:
  godot-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    env:
      REAL_GODOT_PROJECT: tests/fixtures/runtime-behavior
    steps:
      - name: Disable Git autocrlf (let .gitattributes handle line endings)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux Godot runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1 libxcb1 libx11-6 libxcomposite1 libxcursor1 libxi6 libxrandr2 \
            libx11-xcb1 libgl1 libegl1 libasound2-plugins \
            || sudo apt-get install -y \
              libfontconfig1 libxcb1 libx11-6 libxcomposite1 libxcursor1 libxi6 libxrandr2 \
              libx11-xcb1 libgl1 libegl1 libasound2
      - run: npm ci
      - run: npm run build
      - name: Install Godot 4.7.2
        run: node scripts/ci-install-godot.mjs
      - name: Godot README smoke and E2E subset
        run: npm run test:godot-ci
      - name: Dump Godot engine log on failure
        if: failure()
        shell: bash
        run: |
          if [ -d .harness ]; then
            echo "=== .harness contents ==="
            find .harness -type f -ls
            for f in .harness/stderr.log .harness/godot.log .harness/stdout.log .harness/debug-output.log; do
              if [ -f "$f" ]; then echo "=== $f ==="; cat "$f"; echo; fi
            done
          else
            echo "No .harness dir found"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-smoke-evidence-${{ matrix.os }}
          path: |
            .harness
            tests/fixtures/runtime-behavior/.godot
          if-no-files-found: ignore
