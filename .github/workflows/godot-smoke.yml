name: godot-smoke

on:
  push:
  pull_request:

jobs:
  godot-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    env:
      REAL_GODOT_PROJECT: tests/fixtures/runtime-behavior
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux Godot runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1 libxcb1 libx11-6 libxcomposite1 libxcursor1 libxi6 libxrandr2 \
            libx11-xcb1 libgl1 libegl1 libasound2-plugins \
            || sudo apt-get install -y \
              libfontconfig1 libxcb1 libx11-6 libxcomposite1 libxcursor1 libxi6 libxrandr2 \
              libx11-xcb1 libgl1 libegl1 libasound2
      - run: npm ci
      - run: npm run build
      - name: Install Godot 4.7.2
        run: node scripts/ci-install-godot.mjs
      - name: Godot README smoke and E2E subset
        run: npm run test:godot-ci
      - name: Dump Godot stderr on failure
        if: failure()
        shell: bash
        run: |
          echo "=== .harness files ==="
          ls -la .harness/ 2>/dev/null || echo "No .harness dir"
          for f in .harness/stderr.log .harness/godot.log .harness/stdout.log; do
            if [ -f "$f" ]; then
              echo ""
              echo "=== $f ($(wc -l < "$f") lines) ==="
              echo "--- tail 60 ---"
              tail -60 "$f"
              echo "--- ERROR/WARNING lines ---"
              grep -nE '(ERROR|WARNING|error|warning|SCRIPT)' "$f" | head -30 || true
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-smoke-evidence-${{ matrix.os }}
          path: .harness
          if-no-files-found: ignore
