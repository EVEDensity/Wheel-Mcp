name: release-gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  windows-release-gate:
    runs-on: windows-latest
    env:
      REAL_GODOT_PROJECT: tests/fixtures/runtime-behavior
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Clean install from lockfile
        run: npm ci
      - run: npm run build
      - name: Install smoke test
        run: node scripts/install.mjs --skip-npm
      - run: npm run format:check
      - run: npm run lint
      - name: Install Godot 4.7.2 console
        shell: pwsh
        run: |
          $godotDir = Join-Path $env:RUNNER_TEMP 'godot'
          New-Item -ItemType Directory -Force -Path $godotDir | Out-Null
          $exe = Join-Path $godotDir 'Godot_v4.7.2-stable_win64_console.exe'
          Invoke-WebRequest `
            -Uri 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64_console.exe' `
            -OutFile $exe
          & $exe --version
          "GODOT_PATH=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Full test suite
        run: npm test
      - name: Generate release matrix
        run: npm run matrix:generate
      - name: Release check
        run: npm run release:check
      - name: Dependency audit
        run: npm run audit:dependencies
      - name: Generate CycloneDX SBOM
        run: npm run sbom > sbom.json
      - name: Archive release evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          if (Test-Path runs/matrix) { Copy-Item -Recurse runs/matrix artifacts/matrix }
          if (Test-Path sbom.json) { Copy-Item sbom.json artifacts/ }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-gate-evidence
          path: artifacts
