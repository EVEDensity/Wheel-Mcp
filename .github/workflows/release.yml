name: release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      acceptance_only:
        description: Validate main and prepare artifacts without requiring a tag or publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.context.outputs.tag }}
      commit: ${{ steps.context.outputs.commit }}
      publish: ${{ steps.context.outputs.publish }}
      asset_name: ${{ steps.context.outputs.asset_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - name: Verify source, mode and existing tag when publishing
        id: context
        env:
          RELEASE_ACCEPTANCE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.acceptance_only }}
        run: node scripts/github-release-context.mjs
      - run: npm ci --ignore-scripts
      - name: Install verified Godot 4.7.2
        run: node scripts/ci-install-godot.mjs
      - name: Bounded Windows release acceptance and actual package install
        run: node scripts/release-gate-local.mjs
      - name: Independently verify acceptance and artifacts
        run: npm run release:check
      - name: Prepare exact release assets
        run: node scripts/prepare-github-release.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.context.outputs.asset_name }}
          path: runs/github-release/
          if-no-files-found: error
          retention-days: 7
      - name: Bounded failure diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-failure-${{ github.run_attempt }}
          path: |
            runs/local-release/latest.json
            runs/local-release/last-failure-output.txt
            runs/ci/**/summary.json
            runs/ci/**/failure-summary.json
            runs/ci/**/failure-details.txt
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.build.outputs.asset_name }}
          path: release-assets
      - name: Verify asset hashes
        working-directory: release-assets
        run: sha256sum --check --strict SHA256SUMS
      - name: Publish accepted release without overwriting existing releases
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_SHA: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const tag = process.env.RELEASE_TAG;
          const head = process.env.RELEASE_SHA;
          const repo = process.env.GH_REPO;
          if (!/^v\d+\.\d+\.\d+$/.test(tag ?? '') || !/^[a-f0-9]{40}$/.test(head ?? '') ||
              !/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repo ?? '') || !process.env.GH_TOKEN) {
            throw new Error('Invalid publication context or missing token');
          }
          const acceptance = JSON.parse(readFileSync('acceptance.json', 'utf8'));
          if (acceptance.status !== 'PASS' || acceptance.version !== tag.slice(1) || acceptance.head !== head) {
            throw new Error('Acceptance receipt status/version/commit mismatch; no release created');
          }
          const names = [`wheel-mcp-${tag.slice(1)}.tgz`, 'sbom.json', 'acceptance.json', 'SHA256SUMS'];
          const files = names.map((name) => {
            const bytes = readFileSync(name);
            return { name, bytes, digest: `sha256:${createHash('sha256').update(bytes).digest('hex')}` };
          });
          const notes = readFileSync('RELEASE-NOTES.md', 'utf8');
          // Fixed HTTPS hosts, no redirects, no executable code from build artifacts.
          // Never retry mutations: a lost response requires inspection, not replay.
          async function api(path, method = 'GET', body, upload = false, allowMissing = false) {
            const response = await fetch(`https://${upload ? 'uploads' : 'api'}.github.com/repos/${repo}/${path}`, {
              method, redirect: 'error', signal: AbortSignal.timeout(15000),
              headers: {
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2026-03-10',
                ...(body === undefined ? {} : { 'Content-Type': upload ? 'application/octet-stream' : 'application/json' }),
              },
              body: body === undefined ? undefined : upload ? body : JSON.stringify(body),
            });
            if (allowMissing && response.status === 404) return null;
            if (!response.ok) throw new Error(`GitHub ${method} ${path}: HTTP ${response.status}; inspect any draft before retrying`);
            return response.json();
          }
          async function verifyTag() {
            let object = (await api(`git/ref/tags/${tag}`)).object;
            for (let depth = 0; object?.type === 'tag' && depth < 4; depth++) {
              if (!/^[a-f0-9]{40}$/.test(object.sha ?? '')) throw new Error('Invalid annotated tag identity');
              object = (await api(`git/tags/${object.sha}`)).object;
            }
            if (object?.type !== 'commit' || object.sha !== head) throw new Error('Remote tag does not match accepted commit');
          }
          await verifyTag();
          if (await api(`releases/tags/${tag}`, 'GET', undefined, false, true)) {
            throw new Error('Release already exists; refusing to create or modify it');
          }
          // Create returns the exact numeric ID; do not rediscover a draft via the releases list.
          // Creation conflicts fail closed; existing releases are never edited or overwritten.
          const created = await api('releases', 'POST', {
            tag_name: tag, target_commitish: head, draft: true, prerelease: false,
            name: `${tag} · Windows local stable`, body: notes,
          });
          const id = created.id;
          function verifyIdentity(release, draft) {
            if (!Number.isSafeInteger(id) || id <= 0 || release.id !== id || release.tag_name !== tag ||
                release.draft !== draft || release.prerelease !== false) {
              throw new Error('Release ID/tag/draft/prerelease mismatch');
            }
          }
          verifyIdentity(created, true);
          console.log(`Created draft ${id} for ${tag} at accepted commit ${head}`);
          for (const file of files) {
            await api(`releases/${id}/assets?name=${encodeURIComponent(file.name)}`, 'POST', file.bytes, true);
          }
          const release = await api(`releases/${id}`);
          verifyIdentity(release, true);
          if (!Array.isArray(release.assets) || release.assets.length !== files.length) throw new Error('Unexpected release asset count');
          for (const file of files) {
            const matches = release.assets.filter((asset) => asset.name === file.name);
            const asset = matches[0];
            if (matches.length !== 1 || asset.state !== 'uploaded' || asset.size !== file.bytes.length || asset.digest !== file.digest) {
              throw new Error(`Uploaded asset size/state/hash mismatch: ${file.name}; draft ${id} retained`);
            }
          }
          await verifyTag();
          const published = await api(`releases/${id}`, 'PATCH', { draft: false, make_latest: 'true' });
          verifyIdentity(published, false);
          console.log(`Published verified release ${id}: ${tag}`);
          NODE
