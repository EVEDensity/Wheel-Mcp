name: windows-godot

on:
  push:
  pull_request:

jobs:
  godot-smoke:
    runs-on: windows-latest
    env:
      REAL_GODOT_PROJECT: tests/fixtures/runtime-behavior
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Godot 4.7.2 console
        shell: pwsh
        run: |
          $godotDir = Join-Path $env:RUNNER_TEMP 'godot'
          New-Item -ItemType Directory -Force -Path $godotDir | Out-Null
          $exe = Join-Path $godotDir 'Godot_v4.7.2-stable_win64_console.exe'
          Invoke-WebRequest `
            -Uri 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64_console.exe' `
            -OutFile $exe
          & $exe --version
          "GODOT_PATH=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Godot README smoke and E2E subset
        run: npm run test:godot-ci
