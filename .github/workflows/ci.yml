name: ci

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node: [20, 22]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run format:check
      - run: npm run lint
      - run: node --test build/tests/*.test.js
      - run: npm run release:check
      - name: Save platform result
        shell: bash
        run: mkdir -p artifacts && node --test build/tests/*.test.js > artifacts/test-${{ matrix.os }}-node-${{ matrix.node }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: test-${{ matrix.os }}-node-${{ matrix.node }}
          path: artifacts
