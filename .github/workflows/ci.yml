name: ci

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Force LF line endings
        run: |
          git config core.autocrlf false
          git checkout -- .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install smoke test
        run: node scripts/install.mjs --skip-npm
      - run: npm run format:check
      - run: npm run lint
      - run: node --test build/tests/*.test.js
      # Real Godot coverage: .github/workflows/godot-smoke.yml (Windows/macOS/Linux README smoke + E2E subset).
      # Clean-machine release gate: .github/workflows/release-gate.yml (build → test → matrix → release:check → audit/sbom).
      - name: Dependency audit
        run: npm run audit:dependencies
      - name: Generate CycloneDX SBOM
        run: npm run sbom > sbom-${{ matrix.os }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.os }}
          path: sbom-${{ matrix.os }}.json
