name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      engine:
        description: Also run the short headless Godot smoke
        type: boolean
        default: false
      package:
        description: Also verify the real runtime archive installation (no engine)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build, style and core MCP checks
        run: npm run check
      - name: Check whether dependencies changed
        id: dependencies
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci-dependencies.mjs
      - name: Dependency audit
        if: github.event_name == 'workflow_dispatch' || steps.dependencies.outputs.audit == 'true'
        run: npm run audit:dependencies
      - name: Install Godot 4.7.2
        if: github.event_name == 'workflow_dispatch' && inputs.engine
        run: node scripts/ci-install-godot.mjs
      - name: Short headless Godot smoke (no rebuild)
        if: github.event_name == 'workflow_dispatch' && inputs.engine
        run: node scripts/test-godot-ci.mjs
      - name: Optional real archive install check (no engine or rebuild)
        if: github.event_name == 'workflow_dispatch' && inputs.package
        run: node scripts/test-release-package.mjs
      - name: Keep only bounded failure diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci-failure-${{ github.run_attempt }}
          path: |
            runs/ci/**/summary.json
            runs/ci/**/failure-summary.json
            runs/ci/**/failure-details.txt
          if-no-files-found: ignore
          retention-days: 7
