<svg xmlns="http://www.w3.org/2000/svg" width="900" height="465" viewBox="0 0 900 465" role="img" aria-labelledby="title desc"><title id="title">Wheel-mcp: smaller payloads, fewer MCP requests</title><desc id="desc">Seven controlled repair cases, September 13, 2026. Estimated payload tokens 84777 versus 4566; MCP requests 152 versus 7. Not measured billable token savings.</desc><style>text{font-family:Arial,sans-serif;fill:#e2e8f0}.label{font-size:20px;font-weight:700}.small{font-size:16px}.accent{font-size:22px;font-weight:700;fill:#34d399}.note{font-size:15px;fill:#cbd5e1}</style><rect width="900" height="465" rx="18" fill="#0f172a"/><text x="36" y="48" font-size="28" font-weight="700">Smaller payloads. Fewer tool requests.</text><text x="36" y="80" class="note">Wheel-mcp | Controlled scripted comparison | 7 cases | 2026-09-13</text><text x="36" y="145" class="label">Estimated payload tokens</text><text x="864" y="145" text-anchor="end" class="accent">94.61% fewer</text><text x="36" y="190" class="small">Fine-grained</text><rect x="174" y="170" width="560" height="28" rx="5" fill="#64748b"/><text x="744" y="190" class="small">84,777</text><text x="36" y="240" class="small">dev_loop</text><rect x="174" y="220" width="30.161010651473866" height="28" rx="5" fill="#34d399"/><text x="214.16101065147387" y="240" class="small">4,566</text><text x="36" y="330" class="label">MCP requests</text><text x="864" y="330" text-anchor="end" class="accent">95.39% fewer</text><text x="36" y="375" class="small">Fine-grained</text><rect x="174" y="355" width="560" height="28" rx="5" fill="#64748b"/><text x="744" y="375" class="small">152</text><text x="36" y="425" class="small">dev_loop</text><rect x="174" y="405" width="25.789473684210527" height="28" rx="5" fill="#34d399"/><text x="209.78947368421052" y="425" class="small">7</text></svg>
