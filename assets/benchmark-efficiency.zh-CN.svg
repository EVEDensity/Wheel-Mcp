<svg xmlns="http://www.w3.org/2000/svg" width="900" height="465" viewBox="0 0 900 465" role="img" aria-labelledby="title desc"><title id="title">Wheel-mcp：更精简的载荷，更少的 MCP 请求</title><desc id="desc">2026-09-13，7 个受控修复案例。载荷 Token 估算从 84,777 降至 4,566；MCP 请求从 152 次降至 7 次。不是实际计费 Token 的测量结果。</desc><style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#e2e8f0}.label{font-size:20px;font-weight:700}.small{font-size:16px}.accent{font-size:22px;font-weight:700;fill:#34d399}.note{font-size:15px;fill:#cbd5e1}</style><rect width="900" height="465" rx="18" fill="#0f172a"/><text x="36" y="48" font-size="28" font-weight="700">更精简的上下文，更少的工具请求</text><text x="36" y="80" class="note">Wheel-mcp | 受控脚本对比实验 | 7 个案例 | 2026-09-13</text><text x="36" y="145" class="label">载荷 Token 估算值</text><text x="864" y="145" text-anchor="end" class="accent">减少 94.61%</text><text x="36" y="190" class="small">细粒度调用</text><rect x="174" y="170" width="560" height="28" rx="5" fill="#64748b"/><text x="744" y="190" class="small">84,777</text><text x="36" y="240" class="small">批量验证</text><rect x="174" y="220" width="30.161010651473866" height="28" rx="5" fill="#34d399"/><text x="214.16101065147387" y="240" class="small">4,566</text><text x="36" y="330" class="label">MCP 请求次数</text><text x="864" y="330" text-anchor="end" class="accent">减少 95.39%</text><text x="36" y="375" class="small">细粒度调用</text><rect x="174" y="355" width="560" height="28" rx="5" fill="#64748b"/><text x="744" y="375" class="small">152</text><text x="36" y="425" class="small">批量验证</text><rect x="174" y="405" width="25.789473684210527" height="28" rx="5" fill="#34d399"/><text x="209.78947368421052" y="425" class="small">7</text></svg>
